<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <header class="header-6t shadow-sm sticky-top bg-white overflow-hidden">
        <div class="container-fluid position-relative py-2 d-flex align-items-center justify-content-center" style="height: 70px;">
            <div class="carousel-track">
                <div class="carousel-group">
                    <a href="https://satdc.gobernacion.web.ve/" class="logo-link" target="_blank"><img src="gdc.png" alt="GDC" class="logo-header opacity-carrusel"></a>
                    <a href="https://mincyt.gob.ve/" class="logo-link" target="_blank"><img src="MCiencia.png" alt="Mincyt" class="logo-header opacity-carrusel"></a>
                    <a href="https://www.minec.gob.ve/" class="logo-link" target="_blank"><img src="MEcosocialismo.png" alt="Minec" class="logo-header opacity-carrusel"></a>
                    <a href="https://www.caracas.gob.ve/" class="logo-link" target="_blank"><img src="alcaldia.png" alt="Alcaldía" class="logo-header opacity-carrusel"></a>
                </div>
                <div class="carousel-group">
                    <a href="https://satdc.gobernacion.web.ve/" class="logo-link"><img src="gdc.png" alt="GDC" class="logo-header opacity-carrusel"></a>
                    <a href="https://mincyt.gob.ve/" class="logo-link"><img src="MCiencia.png" alt="Mincyt" class="logo-header opacity-carrusel"></a>
                    <a href="https://www.minec.gob.ve/" class="logo-link"><img src="MEcosocialismo.png" alt="Minec" class="logo-header opacity-carrusel"></a>
                    <a href="https://www.caracas.gob.ve/" class="logo-link"><img src="alcaldia.png" alt="Alcaldía" class="logo-header opacity-carrusel"></a>
                </div>
            </div>
            <div class="logo-central-fijo">
                <img src="6T.png" alt="6T En la Calle" class="logo-6t-main">
            </div>
        </div>
    </header>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Mijaíl Rondón">
    <title>Ofertas de Formación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<main class="container py-5">
    <section id="seccion-grupos">
        <h2 class="pb-2 border-bottom mb-4">Temas de Formación</h2>
        <div class="row g-4 row-cols-1 row-cols-md-2 row-cols-lg-3" id="contenedor-grupos"></div>
    </section>

    <section id="seccion-subgrupos" class="d-none">
        <button id="btn-volver-grupos" class="btn btn-outline-primary btn-sm" onclick="volverAGrupos()">← Volver<br>a Temas</button>
        <h2 class="pb-2 border-bottom mb-4">Áreas Disponibles</h2>
        <div class="row row-cols-1 row-cols-md-4 g-4 mb-4" id="contenedor-subgrupos"></div>

    </section>

    <section id="seccion-cursos" class="d-none">
        <button id="btn-volver-subgrupos" class="btn btn-outline-primary btn-sm" onclick="volverASubgrupos()">← Volver<br>a Áreas</button>
        <h2 class="pb-2 border-bottom mb-4 text-primary">Catálogo de Cursos</h2>
        <div class="row row-cols-1 row-cols-md-3 g-3 mb-4" id="contenedor-cursos"></div>

    </section>

    <section class="mt-5 pt-5 border-top">
        <div class="card shadow-lg border-0 p-4 rounded-4">
            <h3 class="text-center mb-4 fw-bold">Formulario de Registro</h3>
            <form id="registro-form">
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Nombre Completo</label>
                        <input type="text" class="form-control" placeholder="Ej: Juan Pérez" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Correo Electrónico</label>
                        <input type="email" class="form-control" placeholder="usuario@correo.com" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Teléfono de Contacto</label>
                        <input type="tel" class="form-control" placeholder="(04XX) 000-0000" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Dirección de Habitación</label>
                        <input type="text" class="form-control" placeholder="Ciudad, Parroquia, Sector..." required>
                    </div>
                    <div class="col-12">
                        <label class="form-label small fw-bold">Día Preferente para Inducción</label>
                        <select required class="form-select">
                            <option value="">-- Seleccione un día --</option>
                            <option>Lunes</option><option>Martes</option>
                            <option>Miércoles</option><option>Jueves</option><option>Viernes</option>
                        </select>
                    </div>
                </div>

                <div class="mt-5">
                    <h5 class="fw-bold text-dark border-bottom pb-2 mb-4">Cursos de Interés (Máximo 4)</h5>
                    <div id="contenedor-seleccion-cursos"></div>
                    <button type="button" id="btn-agregar-curso" class="btn btn-outline-primary w-100 py-2 border-dashed">
                        + Agregar otra preferencia
                    </button>
                </div>

                <div class="text-center mt-5">
                    <button type="submit" class="btn btn-primary btn-lg px-5 shadow">Enviar Solicitud</button>
                </div>
            </form>
        </div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
